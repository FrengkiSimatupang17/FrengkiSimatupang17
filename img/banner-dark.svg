<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Frengki Simatupang — Computer Engineer. Devices, and the software that makes them work.">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1e25" />
      <stop offset="100%" stop-color="#121419" />
    </linearGradient>
    <radialGradient id="glow-dark" cx="88%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#4054d8" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#4054d8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4054d8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cobalt-badge-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5368ee" />
      <stop offset="100%" stop-color="#3c50d6" />
    </linearGradient>
    <pattern id="dots-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.065" />
    </pattern>
    <clipPath id="outer-clip-dark">
      <rect x="1" y="1" width="1198" height="278" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#outer-clip-dark)">
    <rect width="1200" height="280" fill="url(#bg-dark)" />
    <rect width="1200" height="280" fill="url(#dots-dark)" />
    <rect width="1200" height="280" fill="url(#glow-dark)" />

    <!-- Subtle inner double-bezel hairline -->
    <rect x="10" y="10" width="1180" height="260" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <!-- Brand FS Monogram Mark (matching portfolio favicon) -->
    <g transform="translate(56, 48)">
      <path d="M13 0 H43 A13 13 0 0 1 56 13 V43 A13 13 0 0 1 43 56 H4 A4 4 0 0 1 0 52 V13 A13 13 0 0 1 13 0 Z" fill="url(#cobalt-badge-dark)" />
      <g transform="translate(6, 6)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="round">
        <path d="M11 31V13H22M11 22H20M33 13H29C25 13 24 15 24 18C24 21 27 22 29 22C32 22 33 24 33 27C33 30 31 31 27 31H23" />
      </g>
    </g>

    <!-- Location & Role Pill (top-right) -->
    <g transform="translate(882, 54)">
      <rect width="262" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#7c8fff" />
      <text x="34" y="23" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c3c9d6">Batam, Indonesia · IoT &amp; Applied AI</text>
    </g>

    <!-- Name & Statement -->
    <text x="56" y="162" font-family="'IBM Plex Sans Condensed', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#f7f8fa">Frengki Simatupang</text>
    <text x="56" y="202" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#d5dce8">Devices, and the software that makes them work.</text>

    <!-- Footer metadata line -->
    <line x1="56" y1="226" x2="1144" y2="226" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />
    <text x="56" y="250" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#c3c9d6">Computer Engineer · Embedded IoT · Computer Vision · RHCSA (RHEL 9)</text>
    <text x="1144" y="250" text-anchor="end" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c9d3ff">frengkisimatupang.vercel.app</text>
  </g>

  <rect x="1" y="1" width="1198" height="278" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
</svg>
